  SCA-scan:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: log info
        id: log_1
        run: |
          python3 log.py
      - name: Run dependency scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt > sca-report.txt || true
          
      - name: Display sca-report
        run: |
          echo "$(cat sca-report.txt)"

          
  Run-application:
    name: app startup
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0 

      - name: info
        id: info_1
        run: |
          python3 info.py
      
      - name: run streamlit app
        timeout-minutes: 1
        run: |
          pip install -r requirements.txt
          streamlit run app.py
    
      - name: check app status
        run: |
          echo "************* Checking app Status *******************"
          [[ "$(curl localhost:8501)" == *"Streamlit"* ]] && echo "{'status': 'ok'}" || "{'status': 'failed'}"
          echo "************* Checking app Status *******************"
